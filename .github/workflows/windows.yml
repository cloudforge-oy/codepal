# Builds the Windows zip and NSIS installer, signed through SignPath Foundation
# (free code signing for open source) when the SIGNPATH_* settings exist:
#   repository variable  SIGNPATH_ORGANIZATION_ID
#   repository secret    SIGNPATH_API_TOKEN
# Without them the build still runs and uploads unsigned artifacts.
#
# Signing is two requests, because an installer's contents can't be signed after the fact:
#   1. "app"        every .exe/.dll/.node in dist/win-unpacked
#   2. "installer"  the NSIS installer compiled from those signed files
# The matching SignPath artifact configurations are in build/signpath/.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # attach artifacts to the release on tag builds
  actions: read     # SignPath verifies the build that produced the artifact

env:
  SIGNPATH_PROJECT: codepal
  # "test-signing" until SignPath approves the project; then "release-signing".
  SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}

jobs:
  windows:
    runs-on: ubuntu-latest   # electron-builder and makensis cross-build; no wine needed
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win dir

      - name: Upload unsigned app
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/win-unpacked
          include-hidden-files: true

      - name: Sign app files
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/win-signed

      - name: Use signed app files
        if: env.SIGN == 'true'
        run: rm -rf dist/win-unpacked && mv dist/win-signed dist/win-unpacked

      - name: Build installer
        run: node scripts/build-win-installer.mjs

      - name: Upload unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/CodePal-Setup-*.exe

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/installer-signed

      - name: Collect release files
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir release
          if [ "$SIGN" = true ]; then cp dist/installer-signed/CodePal-Setup-*.exe release/
          else cp dist/CodePal-Setup-*.exe release/; fi
          (cd dist/win-unpacked && zip -qr "../../release/CodePal-$version-win.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN == 'true' && 'windows-signed' || 'windows-unsigned' }}
          path: release/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes || gh release upload "$GITHUB_REF_NAME" release/* --clobber
