# Windows builds. Run manually, or by pushing a v* tag.
#
#   installer  NSIS installer + portable zip (unsigned; cross-built on Linux)
#   store      MSIX package for the Microsoft Store (built on Windows; the Store signs it)
#
# The Store package needs the identity Partner Center assigns when the app name is
# reserved (Product identity page). Set them as repository variables:
#   APPX_IDENTITY_NAME   Package/Identity/Name       e.g. 12345TatuHelander.CodePal
#   APPX_PUBLISHER       Package/Identity/Publisher  e.g. CN=01234567-89AB-CDEF-0123-456789ABCDEF
# Without them the store job still builds, with placeholder identity, to prove the
# packaging works; that package cannot be submitted.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # attach artifacts to the release on tag builds

jobs:
  installer:
    runs-on: ubuntu-latest   # electron-builder and makensis cross-build; no wine needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            dist/CodePal-Setup-*.exe
            dist/CodePal-*-win.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/CodePal-Setup-*.exe dist/CodePal-*-win.zip --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/CodePal-Setup-*.exe dist/CodePal-*-win.zip --clobber

  store:
    runs-on: windows-latest   # MSIX packaging (makeappx) only exists on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build MSIX
        shell: bash
        env:
          APPX_IDENTITY_NAME: ${{ vars.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ vars.APPX_PUBLISHER }}
        run: |
          args=()
          if [ -n "$APPX_IDENTITY_NAME" ] && [ -n "$APPX_PUBLISHER" ]; then
            args+=("-c.appx.identityName=$APPX_IDENTITY_NAME" "-c.appx.publisher=$APPX_PUBLISHER")
          else
            echo "::warning::APPX_IDENTITY_NAME / APPX_PUBLISHER not set: building with placeholder identity (not submittable)"
          fi
          npx electron-builder --win appx "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: dist/*.appx
